# @package _global_
defaults:
  - override /training: 200m/pretrain
  - override /model: 200m
  - override /dataset: fineweb-edu-10bt
  - _self_

training:
  exp_name: pretrain-1K-200m-fa-swa1k
  wandb_project: thesis-200m
  wandb_tags: [pretrain, fa, baseline, 1K-window, fineweb-edu-10BT]
  train_mode: pretrain
  seq_length: 1024
  global_batch_size: 512
  source_seq_length: 8192
  data_min_seq_length: 8192
  eval_min_seq_length: 8192
  source_split: train
  eval_fraction: 0.05

model:
  seq_modeling_block: self_attention
  force_flash: True
  mini_batch_size: 1024
  rope_theta: 500000
  remat_block: nothing_saveable
  remat_block_bwd: nothing_saveable
