  wandb_project: thesis-200m-pretrained-ttt
  wandb_tags: [pretrained-ttt, continue, ip-ttt, treatment, conv-embedding, 8K, 1K-window, budget-5p, from-swa, flash, lr-8e-5]
  train_mode: pretrain
  load_part: params
  resume_exp_name: pretrain-8K-200m-swa-mb2048-swa1k
  resume_step: 7629
  total_steps: 382
  seq_length: 8192
  global_batch_size: 64
  accum_steps: 8
  num_evals: 3
  checkpoint_interval_steps: 100
  ilr_warmup_steps: 38
