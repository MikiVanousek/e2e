# @package _global_
defaults:
  - override /training: 200m/pretrain
  - override /model: 200m
  - override /dataset: fineweb-edu-10bt
  - _self_

training:
  exp_name: pretrain-8K-200m-ip-ttt-conv-embedding-b1024-mb8192-swa1k
  wandb_project: thesis-200m
  wandb_tags: [pretrain, ip-ttt, treatment, conv-embedding, 1K-window, ttt-batch-1024, mb-8192, fineweb-edu-10BT]
  train_mode: pretrain
  seq_length: 8192
  global_batch_size: 64
  source_seq_length: 8192
  data_min_seq_length: 8192
  eval_min_seq_length: 8192
  source_split: train
  eval_fraction: 0.05

model:
  seq_modeling_block: SWA
  force_flash: False
  unroll_block_scan: True
  mini_batch_size: 8192
  sliding_window_size: 1024
  rope_theta: 500000
  remat_block: nothing_saveable
  remat_block_bwd: nothing_saveable
  remat_mlp: nothing_saveable
  remat_mlp_bwd: nothing_saveable
  ip_ttt: true
  ip_ttt_layers: [6, 12]
  ip_ttt_chunk: 1024
  ip_ttt_lr: 3.0
  ip_ttt_proj: true
  ip_ttt_target: conv_embedding
