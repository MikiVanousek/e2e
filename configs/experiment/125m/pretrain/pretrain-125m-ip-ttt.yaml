# @package _global_
defaults:
  - override /training: 125m/pretrain-8K
  - override /model: 125m
  - _self_

training:
  exp_name: pretrain-125m-ip-ttt
  wandb_project: thesis-125m
  wandb_tags: [pretrain, ip-ttt, treatment]
  train_mode: pretrain
  accum_steps: 4

model:
  seq_modeling_block: self_attention
  force_flash: True
  mini_batch_size: 8192
  rope_theta: 500000
  remat_block: nothing_saveable
  remat_block_bwd: nothing_saveable
  remat_mlp: nothing_saveable
  remat_mlp_bwd: nothing_saveable
  ip_ttt: true
  ip_ttt_layers: [5, 11]
  ip_ttt_chunk: 1024
  ip_ttt_lr: 3.0
  ip_ttt_proj: true
