# @package _global_
defaults:
  - override /training: 125m/pretrain-8K
  - override /model: 125m
  - _self_

training:
  exp_name: pretrain-125m-fa
  wandb_project: thesis-125m
  wandb_tags: [pretrain, fa, baseline]
  train_mode: pretrain
  accum_steps: 4
  source_seq_length: 8192
  source_split: train
  eval_fraction: 0.05

model:
  seq_modeling_block: self_attention
  force_flash: True
  mini_batch_size: 8192
  rope_theta: 500000
  remat_block: nothing_saveable
  remat_block_bwd: nothing_saveable
