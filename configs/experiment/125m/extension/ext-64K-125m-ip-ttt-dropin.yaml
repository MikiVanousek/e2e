# @package _global_
# Ablation of ext-64K-125m-ip-ttt: starts extension from the FA pretrain
# checkpoint (pretrain-125m-fa) instead of the IP-TTT-equipped pretrain
# checkpoint (pretrain-125m-ip-ttt). This matches the In-Place TTT
# paper's headline drop-in / continual-pretraining setting: graft fresh,
# zero-initialized TTT components onto an existing pretrained model.
# At step 0, the TTT conv1d is zero and the projection is diagonal-only,
# so the model is functionally identical to SWA. Removes the confound
# between method (TTT update on/off) and starting checkpoint.
defaults:
  - 125m/extension/_base-ip-ttt
  - _self_

training:
  exp_name: ext-64K-125m-ip-ttt-dropin
  wandb_tags: [extension, ip-ttt, ablation, 64K, drop-in]
  resume_exp_name: pretrain-125m-fa
  seq_length: 65536
  global_batch_size: 16
  accum_steps: 16
  eval_batch_size: 2

model:
  mini_batch_size: 65536
