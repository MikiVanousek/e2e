# @package _global_
defaults:
  - override /training: 125m/ext
  - override /model: 125m
  - override /dataset: pg19
  - _self_

training:
  resume_exp_name: pretrain-125m-ip-ttt
  wandb_project: thesis-125m
  wandb_tags: [extension, ip-ttt, treatment, stateful-swa, swafull-fix-rerun]
  load_part: params
  num_evals: 2
  train_mode: pretrain
  source_seq_length: 131072
  source_split: train
  eval_fraction: 0.05

model:
  seq_modeling_block: SWA
  force_flash: False
  unroll_block_scan: True
  # Concrete IP-TTT extension configs must override this to training.seq_length.
  mini_batch_size: 1024
  sliding_window_size: 8192
  rope_theta: 500000
  remat_block: nothing_saveable
  remat_block_bwd: nothing_saveable
  remat_mlp: nothing_saveable
  remat_mlp_bwd: nothing_saveable
  ip_ttt: true
  ip_ttt_layers: [5, 11]
  ip_ttt_chunk: 1024
  ip_ttt_lr: 3.0
  ip_ttt_proj: true
  ip_ttt_target: conv_current_layer
