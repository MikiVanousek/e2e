# @package _global_
defaults:
  - override /training: 125m/ext
  - override /model: 125m
  - override /dataset: pg19
  - _self_

training:
  resume_exp_name: pretrain-125m-fa
  wandb_project: thesis-125m
  wandb_tags: [extension, swa, baseline, stateful-swa, swafull-fix-rerun]
  load_part: params
  num_evals: 2
  source_seq_length: 131072
  source_split: train
  eval_fraction: 0.05

model:
  seq_modeling_block: SWA
  force_flash: False
  unroll_block_scan: True
  mini_batch_size: 1024
  sliding_window_size: 8192
  rope_theta: 500000
  remat_block: nothing_saveable
  remat_block_bwd: nothing_saveable
