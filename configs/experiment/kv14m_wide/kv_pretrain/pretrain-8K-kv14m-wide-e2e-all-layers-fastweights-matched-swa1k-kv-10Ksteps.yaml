# @package _global_
defaults:
  - kv14m_wide/kv_pretrain/_base-fa
  - _self_

training:
  exp_name: pretrain-8K-kv14m-wide-e2e-all-layers-fastweights-matched-swa1k-kv-10Ksteps
  wandb_tags: [pretrain, kv, scratch, e2e, swa, 1K-window, all-layers, fastweights-matched, 8K, steps-10K, kv14m-wide]
  train_mode: meta
  seq_length: 8192
  global_batch_size: 256
  accum_steps: 8
  spec_inner: ["language_model.**.suffix_blocks.feed_forward_prime.**"]
  ilr_init: 0.0001

  optimizer_inner:
    optimizer_type: sgd
    lr: 0.0001
    clip_gradient: 1.0

model:
  seq_modeling_block: SWA
  force_flash: false
  unroll_block_scan: true
  sliding_window_size: 1024
  mini_batch_size: 2048
  intermediate_size: 2048
  prime: true
  prime_zero_init: true
  suffix_len: 4
  prime_intermediate_size: 683
  remat_mlp: nothing_saveable
  remat_mlp_bwd: nothing_saveable
