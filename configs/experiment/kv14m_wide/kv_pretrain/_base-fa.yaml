# @package _global_
defaults:
  - override /training: 14m/pretrain-8K
  - override /model: kv14m_wide
  - override /dataset: synthetic_kv
  - _self_

dataset:
  synthetic_num_pairs: 4095
  synthetic_num_docs: 2097152

training:
  wandb_project: thesis-kv14m-wide
  exp_folder: kv14m-wide-kv-pretrain
  load_part: none
  resume_exp_name: ""
  train_mode: pretrain
  total_steps: 10000
  num_evals: 0
  max_eval_batches: 0

  optimizer_outer:
    lr_decay_steps: 10000
    lr_warmup_steps: 1000

model:
  seq_modeling_block: self_attention
  force_flash: True
  rope_theta: 500000
  remat_block: nothing_saveable
  remat_block_bwd: nothing_saveable
