# @package _global_
# Ablation of ext-32K-14m-ip-ttt: starts extension from the FA pretrain
# checkpoint (pretrain-14m-fa) instead of the IP-TTT-equipped pretrain
# checkpoint (pretrain-14m-ip-ttt-v2). This matches the In-Place TTT
# paper's headline drop-in / continual-pretraining setting: graft fresh,
# zero-initialized TTT components onto an existing pretrained model.
# At step 0, the TTT conv1d is zero and the projection is diagonal-only,
# so the model is functionally identical to SWA. Removes the confound
# between method (TTT update on/off) and starting checkpoint.
defaults:
  - 14m/extension/_base-ip-ttt
  - _self_

training:
  exp_name: ext-32K-14m-ip-ttt-dropin
  wandb_tags: [extension, ip-ttt, ablation, 32K, drop-in]
  resume_exp_name: pretrain-14m-fa
  seq_length: 32768
  global_batch_size: 32

model:
  mini_batch_size: 32768
